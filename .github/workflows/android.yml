name: Arura Android APK Build & Release

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Arura-Streaming-v1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arura-Streaming-Android-APK
          path: Arura-Streaming-v1.0.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Arura Streaming v1.0.0 (Android Release)"
          body: |
            ## 📱 Arura Streaming Platform — Android Release v1.0.0
            
            - **All-in-One Entertainment Streaming**: Movies, TV Series, Bangla Natok, Live TV with EPG, Live Sports & AI Discovery.
            - **ExoPlayer & Media3**: Low-latency HLS video playback.
            - **Dark Cinematic Theme**: Material 3 UI design.
            
            ### ⬇️ Download:
            Download the attached **`Arura-Streaming-v1.0.apk`** below to install on your Android device.
          files: Arura-Streaming-v1.0.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
