    <script>
      // Suppress Vite HMR WebSocket connection closed errors in iframe preview
      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (
          e.reason.message?.includes('WebSocket') ||
          e.reason.message?.includes('vite') ||
          String(e.reason).includes('WebSocket closed without opened')
        )) {
          e.preventDefault();
        }
      });

        if (e && e.message && (
          e.message.includes('WebSocket') ||
          e.message.includes('@vite/client')
        )) {
          e.preventDefault();
        }
      });
